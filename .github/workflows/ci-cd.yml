name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*-release']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPO: alikheirandis1998h/base

jobs:
  backend-test:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/backend/go.mod
          cache-dependency-path: app/backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  web-check:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  images:
    name: Build and push images
    needs: [backend-test, web-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Decide whether to publish
        id: publish
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && { [ "$GITHUB_REF" = refs/heads/main ] || [[ "$GITHUB_REF" == refs/tags/v*-release ]]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags for the API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=api-
            type=ref,event=tag,prefix=api-
            type=raw,value=api-latest,enable={{is_default_branch}}

      - name: Tags for the web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=web-
            type=ref,event=tag,prefix=web-
            type=raw,value=web-latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          file: app/backend/Dockerfile
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          tags: ${{ steps.meta-api.outputs.tags }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          build-args: |
            EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL || 'http://api.baseapp.local:30080' }}
          tags: ${{ steps.meta-web.outputs.tags }}

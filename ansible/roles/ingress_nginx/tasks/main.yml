---
- name: Render the ingress controller values
  ansible.builtin.template:
    src: ingress-nginx-values.yaml.j2
    dest: /etc/kubernetes/athena-ingress-nginx-values.yaml
    mode: "0644"
  register: ingress_nginx_values

- name: Read the installed ingress controller release
  ansible.builtin.command: helm list --all --namespace {{ ingress_nginx_namespace }} --filter '^nginx-ingress$' --output json
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ingress_nginx_release
  changed_when: false

- name: Install or upgrade the ingress controller when the chart or the values change
  ansible.builtin.command: >-
    helm upgrade --install nginx-ingress oci://ghcr.io/nginx/charts/nginx-ingress@{{ ingress_nginx_chart_digest }}
    --namespace {{ ingress_nginx_namespace }} --create-namespace
    --values /etc/kubernetes/athena-ingress-nginx-values.yaml
    --wait --timeout 10m
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: >-
    ingress_nginx_values.changed or
    (ingress_nginx_release.stdout | from_json | selectattr('chart', 'equalto', 'nginx-ingress-' ~ ingress_nginx_chart_version) | selectattr('status', 'equalto', 'deployed') | list | length == 0)

- name: Wait for the ingress controller rollout
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf -n {{ ingress_nginx_namespace }} rollout status deployment/nginx-ingress-controller --timeout=5m
  changed_when: false

---
- name: Create kubeadm patches directory
  ansible.builtin.file:
    path: "{{ kubeadm_patches_dir }}"
    state: directory
    mode: "0755"

- name: Render kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0644"

- name: Bind kube-apiserver to this node's address, not 0.0.0.0 (HAProxy owns the VIP port)
  ansible.builtin.template:
    src: kube-apiserver-patch.json.j2
    dest: "{{ kubeadm_patches_dir }}/kube-apiserver+json.json"
    mode: "0644"

# Port-6443 is skipped on purpose: HAProxy holds VIP:6443, and kube-apiserver binds only node IPs.
- name: Initialize the first control-plane node
  ansible.builtin.shell: >-
    kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --ignore-preflight-errors=Port-6443
    > /var/log/athena-kubeadm-init.log 2>&1
  args:
    executable: /bin/bash
    creates: /etc/kubernetes/admin.conf
  when: inventory_hostname == groups['control_plane'][0]

- name: Check whether this node has joined the cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: join_state

- name: List control-plane nodes that still need to join
  ansible.builtin.set_fact:
    cp_join_pending: "{{ groups['control_plane'] | map('extract', hostvars) | selectattr('join_state.stat.exists', 'equalto', false) | list | length > 0 }}"
  run_once: true

- name: Create a short-lived join token on the first control-plane node
  ansible.builtin.command: "kubeadm token create --ttl {{ kubeadm_token_ttl }}"
  register: cp_token
  when: cp_join_pending | bool
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true
  no_log: true

- name: Upload control-plane certificates for joining nodes
  ansible.builtin.shell: >-
    umask 077 &&
    kubeadm init phase upload-certs --upload-certs --config /etc/kubernetes/kubeadm-config.yaml
    > /etc/kubernetes/athena-certificate-key 2> /var/log/athena-kubeadm-certs.log
  args:
    executable: /bin/bash
  when: cp_join_pending | bool
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true
  no_log: true

- name: Read the certificate key for joining nodes
  ansible.builtin.slurp:
    src: /etc/kubernetes/athena-certificate-key
  register: cp_certs
  when: cp_join_pending | bool
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true
  no_log: true

- name: Compute the cluster CA hash for join verification
  ansible.builtin.shell: >-
    openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt | openssl rsa -pubin -outform der 2>/dev/null |
    openssl dgst -sha256 -hex | sed 's/^.* //'
  args:
    executable: /bin/bash
  register: cp_ca_hash
  when: cp_join_pending | bool
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true
  changed_when: false
  no_log: true

- name: Keep the join values as facts for the joining nodes
  ansible.builtin.set_fact:
    join_token: "{{ cp_token.stdout | trim }}"
    join_ca_hash: "{{ cp_ca_hash.stdout | trim }}"
    join_certificate_key: "{{ (cp_certs.content | b64decode).strip().split('\n')[-1] }}"
  when: cp_join_pending | bool
  run_once: true
  no_log: true

- name: Render the join configuration for this control-plane node
  ansible.builtin.template:
    src: join-control-plane.yaml.j2
    dest: /etc/kubernetes/athena-join.yaml
    mode: "0600"
  when: not join_state.stat.exists and inventory_hostname != groups['control_plane'][0]
  no_log: true

- name: Join the remaining control-plane nodes one at a time
  ansible.builtin.shell: >-
    kubeadm join --config /etc/kubernetes/athena-join.yaml --ignore-preflight-errors=Port-6443
    > /var/log/athena-kubeadm-join.log 2>&1
  args:
    executable: /bin/bash
    creates: /etc/kubernetes/kubelet.conf
  when: not join_state.stat.exists and inventory_hostname != groups['control_plane'][0]
  throttle: 1

- name: Remove this node's join configuration once it has joined
  ansible.builtin.file:
    path: /etc/kubernetes/athena-join.yaml
    state: absent
  when: inventory_hostname != groups['control_plane'][0]

- name: Remove the certificate key once joins are done
  ansible.builtin.file:
    path: /etc/kubernetes/athena-certificate-key
    state: absent
  when: cp_join_pending | bool
  delegate_to: "{{ groups['control_plane'][0] }}"
  run_once: true

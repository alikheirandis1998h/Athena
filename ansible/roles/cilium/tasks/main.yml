---
- name: Copy the pinned Cilium chart to this node
  ansible.builtin.copy:
    src: "cilium-{{ cilium_chart_version }}.tgz"
    dest: "/var/tmp/cilium-{{ cilium_chart_version }}.tgz"
    mode: "0644"

- name: Check the Cilium chart checksum
  ansible.builtin.stat:
    path: "/var/tmp/cilium-{{ cilium_chart_version }}.tgz"
    checksum_algorithm: sha256
    get_checksum: true
  register: cilium_chart_stat

- name: Stop when the Cilium chart does not match the pinned checksum
  ansible.builtin.assert:
    that: cilium_chart_stat.stat.checksum == cilium_chart_sha256
    fail_msg: "The vendored Cilium chart does not match cilium_chart_sha256."

- name: Render the Cilium values
  ansible.builtin.template:
    src: cilium-values.yaml.j2
    dest: /etc/kubernetes/athena-cilium-values.yaml
    mode: "0644"
  register: cilium_values

- name: Read the installed Cilium release
  ansible.builtin.command: helm list --all --namespace kube-system --filter '^cilium$' --output json
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cilium_release
  changed_when: false

- name: Install or upgrade Cilium when the chart or the values change
  ansible.builtin.command: >-
    helm upgrade --install cilium /var/tmp/cilium-{{ cilium_chart_version }}.tgz
    --namespace kube-system
    --values /etc/kubernetes/athena-cilium-values.yaml
    --wait --timeout 10m
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: >-
    cilium_values.changed or
    (cilium_release.stdout | from_json | selectattr('chart', 'equalto', 'cilium-' ~ cilium_chart_version) | selectattr('status', 'equalto', 'deployed') | list | length == 0)

- name: Wait for the Cilium agents and every node to become Ready
  ansible.builtin.shell: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system rollout status daemonset/cilium --timeout=5m &&
    kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready nodes --all --timeout=5m
  args:
    executable: /bin/bash
  changed_when: false

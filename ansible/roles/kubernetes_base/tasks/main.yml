---
- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Fetch the Kubernetes apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    checksum: "sha256:{{ kubernetes_apt_key_sha256 }}"
    mode: "0644"

- name: Add the Kubernetes apt repository for the pinned minor
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.sources
    content: |
      Types: deb
      URIs: https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/
      Suites: /
      Signed-By: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"
  register: kubernetes_repo

- name: Install containerd and the pinned Kubernetes packages
  ansible.builtin.apt:
    name:
      - "containerd={{ containerd_package_version }}"
      - "kubelet={{ kubernetes_package_version }}"
      - "kubeadm={{ kubernetes_package_version }}"
      - "kubectl={{ kubernetes_package_version }}"
    state: present
    update_cache: "{{ kubernetes_repo.changed }}"
    cache_valid_time: 3600

- name: Hold Kubernetes packages so unattended upgrades do not move them
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate the default containerd configuration once
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    executable: /bin/bash
    creates: /etc/containerd/config.toml

- name: Use the systemd cgroup driver for runc
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Pin the sandbox (pause) image to the version kubeadm expects
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'registry\.k8s\.io/pause:[0-9.]+'
    replace: '{{ registry_url }}/oss/v2/kubernetes/pause:{{ kubernetes_pause_version }}'
  notify: Restart containerd

- name: Point crictl at containerd
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
    mode: "0644"

- name: Advertise the cluster network address as the kubelet node IP
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ ansible_host }}\n"
    mode: "0644"
  notify: Restart kubelet

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Check whether this node already has a kubelet configuration
  ansible.builtin.stat:
    path: /var/lib/kubelet/config.yaml
  register: kubelet_config

- name: Let systemd allow the kubelet's shutdown delay (logind caps it at 5 s by default)
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    mode: "0755"

- name: Write the logind shutdown delay drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/athena.conf
    content: "[Login]\nInhibitDelayMaxSec={{ kubelet_inhibit_delay_max }}\n"
    mode: "0644"
  notify: Restart logind

- name: Read the kubelet configuration that kubeadm wrote on this node
  ansible.builtin.slurp:
    src: /var/lib/kubelet/config.yaml
  register: kubelet_config_raw
  when: kubelet_config.stat.exists

- name: Work out the kubelet settings for nodes that already joined the cluster
  ansible.builtin.set_fact:
    kubelet_config_wanted: >-
      {{ kubelet_config_raw.content | b64decode | from_yaml
         | combine({
             'serializeImagePulls': false,
             'maxParallelImagePulls': kubelet_max_parallel_image_pulls,
             'systemReserved': kubelet_system_reserved,
             'kubeReserved': kubelet_kube_reserved,
             'evictionHard': kubelet_eviction_hard,
             'evictionSoft': kubelet_eviction_soft,
             'evictionSoftGracePeriod': kubelet_eviction_soft_grace_period,
             'shutdownGracePeriod': kubelet_shutdown_grace_period,
             'shutdownGracePeriodCriticalPods': kubelet_shutdown_grace_period_critical_pods
           }) }}
  when: kubelet_config.stat.exists

- name: Apply the kubelet settings on nodes that already joined the cluster
  ansible.builtin.copy:
    dest: /var/lib/kubelet/config.yaml
    content: "{{ kubelet_config_wanted | to_nice_yaml(indent=2) }}"
  when:
    - kubelet_config.stat.exists
    - (kubelet_config_raw.content | b64decode | from_yaml) != kubelet_config_wanted
  notify: Restart kubelet

- name: Enable kubelet (it starts for real during kubeadm init or join)
  ansible.builtin.systemd:
    name: kubelet
    enabled: true

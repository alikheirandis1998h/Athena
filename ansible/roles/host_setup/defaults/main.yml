---
host_setup_vagrant_version: "2.4.9"
host_setup_vagrant_sha256: "42d830d05e6e9e647f8a5c854d9f5295e319dac74edd37d54b97b4f29cbbd70d"
# Mirror of the HashiCorp .deb, reachable without a VPN. The checksum above verifies it.
host_setup_vagrant_deb_url: "https://cdn.te7.ir/vagrant_{{ host_setup_vagrant_version }}-1_amd64.deb"
host_setup_vagrant_libvirt_version: "0.12.2"
host_setup_apt_packages:
  - qemu-system-x86
  - libvirt-daemon-system
  - libvirt-clients
  - libvirt-dev
  - libxslt1-dev
  - libxml2-dev
  - zlib1g-dev
  - build-essential
  - ebtables
  - dnsmasq-base

host_setup_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
host_setup_cache_dir: "{{ lookup('ansible.builtin.env', 'XDG_CACHE_HOME') or (lookup('ansible.builtin.env', 'HOME') ~ '/.cache') }}/athena"
host_setup_acl_dropin: /etc/systemd/system/libvirtd.service.d/athena-socket-acl.conf
host_setup_libvirt_socket: /var/run/libvirt/libvirt-sock

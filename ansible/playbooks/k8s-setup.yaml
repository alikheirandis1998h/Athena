---
- hosts: kubernetes
  become: true
  roles:
    - node_tuning

- hosts: control_plane
  become: true
  gather_facts: false
  roles:
    - haproxy_keepalived

- hosts: kubernetes
  become: true
  gather_facts: false
  roles:
    - kubernetes_base

- hosts: control_plane
  become: true
  gather_facts: false
  roles:
    - kubeadm_control_plane

- hosts: workers
  become: true
  gather_facts: false
  roles:
    - kubeadm_worker

- hosts: workers
  become: true
  gather_facts: false
  tasks:
    - name: Prepare the workers for Longhorn volumes
      ansible.builtin.include_role:
        name: longhorn
        tasks_from: workers

- hosts: control_plane[0]
  become: true
  gather_facts: false
  roles:
    - helm
    - cilium
    - longhorn
    - ingress_nginx
    - admin_tools
